[project]
name = "reeval"
version = "0.1.0"
description = "Reliable and Efficient EVALuations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Théo Matricon" }]
keywords = ["statistics", "evaluation", "sample-size", "benchmarks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "scipy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/Theomat/reeval"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pre-commit>=3.0", "ruff>=0.8"]


